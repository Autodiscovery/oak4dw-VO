# Parameters for the on-device stereo VO app.
#
# Values marked "Phase 0" are placeholders derived from the published FoV spec
# and must be replaced with measurements from tools/phase0_calibration_check.py
# before the numbers here mean anything.

/oak:
  ros__parameters:
    driver:
      i_enable_ir: false
      i_publish_tf_from_calibration: true

    pipeline_gen:
      i_pipeline_type: oak_vio::StereoVioPipeline
      i_nn_type: none

    vio:
      # ---- Sensor configuration ----------------------------------------
      # 640x400, not the 1280x800 originally planned.
      #
      # The plan assumed corner detection and tracking would be free on the RVC4
      # hardware block, making resolution almost cost-free. That block is broken
      # on this firmware (see docs/luxonis-bug-featuretracker-rvc4.md), so
      # tracking runs on the ARM cores and resolution now costs CPU directly:
      # roughly 8-12 ms/frame here versus 25-40 at full resolution.
      #
      # The price is a halved focal length, so depth sigma at 5 m goes from
      # ~29 cm to ~59 cm. Raise these if you would rather spend the CPU, and
      # watch the "tracker N ms" figure in the periodic log.
      i_width: 640
      i_height: 400
      i_fps: 30.0

      # Sensor mode, set explicitly rather than left to auto-selection. Two
      # reasons: requestOutput only honours the GRAY8 request when the sensor is
      # configured explicitly, and the sensor frame rate only takes effect when
      # passed to build().
      #
      # Must be a resolution the OV9282 supports (1280x800 is native full frame),
      # and must keep the same aspect ratio as i_width/i_height above so the
      # downscale is a pure resize. 640x400 and 1280x800 are both 1.6, giving an
      # exact 2x downscale.
      i_sensor_width: 1280
      i_sensor_height: 800

      # IS A CABLE PLUGGED INTO THIS CAMERA'S M8 "IN" PORT?
      #
      # A physical fact about the rig, not a preference. There is no API to query
      # it, so it has to be told to us, and it decides who owns the frame rate:
      #
      #   true  -- cable IN. This camera is an FSYNC SLAVE. The master sets the
      #            rate, i_fps above has NO EFFECT, and the sensor rate must not be
      #            touched (trying aborts the pipeline with "Cannot override fps
      #            while using external FSYNC slave mode").
      #
      #   false -- nothing in IN. This camera GENERATES FSYNC, owns its timing, and
      #            i_fps is applied to the sensor. It also then defines the rate for
      #            any camera slaved to its OUT port.
      #
      # Getting it wrong is not symmetric, which is why the default is true:
      #   slave told it is master  -> pipeline aborts at start, loudly and obviously
      #   master told it is slave  -> runs, but i_fps is silently ignored
      #
      # To run this camera at 30 (or 60) Hz: unplug its "IN", drive the other
      # cameras from its "OUT", set this false, and set i_fps above. The startup log
      # states which mode it is in, and the periodic log compares the requested rate
      # against the delivered one and warns if they disagree.
      #
      # Older OAK PoE models can only ever be slaves; OAK 4 D can be either. Up to
      # 3 devices per chain before cumulative resistance degrades the signal.
      i_fsync_connected: true

      # MUST match StereoDepth's subpixel configuration. 5 bits = 1/32 px.
      # A mismatch scales every depth by a power of two, which produces a
      # trajectory of the right shape and the wrong size.
      i_subpixel_fractional_bits: 5

      # Left at -1 (StereoDepth's default): alpha scaling appears to do NOTHING on
      # RVC4. Measured across 0.0 / 0.5 / 1.0 with no effect on valid disparity
      # (13.0 / 13.0 / 13.4%), epipolar error (0.91 / 0.96 / 0.84 px) or the solved
      # region (85.5 / 86.0 / 85.1%). The field-of-view versus rectification-stretch
      # trade the plan assumed this controlled is not available here.
      i_alpha_scaling: -1.0

      # ---- Frames -------------------------------------------------------
      i_odom_frame: odom
      i_base_frame: oak_vio_frame
      i_publish_tf: true
      # Convert from the camera optical convention (x right, y down, z fwd)
      # to the ROS body convention (x fwd, y left, z up). Leave on unless you
      # specifically want optical-frame odometry.
      i_publish_ros_convention: true

      # ---- Feature gating ------------------------------------------------
      # The floor stays low on purpose. Far points carry most of the rotation
      # information, and the estimator already down-weights them correctly by
      # propagating their depth uncertainty, so there is no need to discard
      # them. Raise this only if Phase 0 shows disparity is unreliable at the
      # low end.
      i_min_disparity_px: 1.5
      i_max_disparity_px: 200.0
      i_max_tracking_error: 30.0
      # Left at 0.0 deliberately, despite Phase 0 finding real distortion at the
      # edges. Two runs at 0.51 m and 0.72 m agree closely on the radial profile of
      # departure-from-planarity, as a percentage of disparity:
      #
      #     radius   0-50%    ~0.5%
      #     radius  50-67%    0.9-1.3%
      #     radius 67-100%    2.1-3.1%
      #
      # A step at ~67% radius rather than smooth growth, reproducible across two
      # ranges, which is what uncorrected lens distortion surviving rectification
      # looks like. Depth error of that size is scale error of that size for
      # features out there.
      #
      # Masking it is not obviously worth it. Excluding everything beyond 67%
      # radius needs a border fraction of ~0.165, which discards 55% of the pixel
      # area -- and wide field of view is the main thing this lens is for, being
      # what makes rotation observable and tracking robust. Meanwhile bucketing
      # spreads features across the frame, so only some of them carry the 3%, and
      # the net scale effect is likely ~1%, comparable to VO drift itself.
      #
      # So: measure closed-loop drift first. If scale comes out a few percent long
      # or short, revisit this. Do not pay 55% of the image up front for a fix to a
      # problem that has not been shown to matter.
      i_mask_border_fraction: 0.0

      # ---- Which feature front-end ---------------------------------------
      # false: OpenCV Harris + Lucas-Kanade on the ARM cores (8-12 ms/frame at
      #        640x400). What has been shipping, and what the Status numbers in
      #        the README were measured with.
      # true:  the RVC4 hardware feature-tracker block, which costs ~0 CPU and
      #        would let tracking run at 1280x800 -- halving depth sigma, since
      #        the focal length doubles.
      #
      # Default false, and it should stay false until it is confirmed on YOUR
      # device. The history is in docs/luxonis-bug-featuretracker-rvc4.md: this
      # node returned zero features for every configuration tried and took the
      # firmware down with it. Luxonis have since identified the cause of the
      # empty output, and the two parameters below are the fix. Check it with:
      #
      #     python3 tools/probe_feature_tracker.py --device <ip> --luxonis-config
      #
      # If that reports corners, turn this on and compare closed-loop drift at
      # 640x400 before raising the resolution -- one change at a time.
      i_use_hw_tracker: false

      # Harris threshold for the hardware detector.
      #
      # This scale is NOT normalised. 20000 is the value Luxonis gave; an
      # earlier probe here passed 0.01, assuming a 0-1 scale, and recorded the
      # resulting zero features as evidence that explicit thresholds did not
      # help. Six orders of magnitude out, and the wrong conclusion drawn.
      i_hw_tracker_threshold: 20000.0

      # Applied to BOTH numMaxFeatures and numTargetFeatures.
      #
      # numMaxFeatures defaults to ZERO in the bindings, so a corner detector
      # with only numTargetFeatures set is capped at no features at all --
      # silently, and regardless of the threshold. That is the other half of why
      # the earlier explicit-threshold test came back empty.
      i_hw_tracker_max_features: 256

      # setHardwareResources(n, n); negative leaves the node's own default.
      i_hw_tracker_hardware_resources: -1
      # The block's own optical-flow motion estimator.
      i_hw_motion_estimator: true

      # ---- CPU feature detection and tracking ----------------------------
      # Used when i_use_hw_tracker is false.
      # OpenCV goodFeaturesToTrack + calcOpticalFlowPyrLK, replacing the broken
      # hardware block. These are the knobs that trade accuracy against the
      # per-frame CPU cost.
      i_max_features: 320
      # Corner strength floor, relative to the strongest corner in the frame.
      i_quality_level: 0.01
      # Minimum corner separation, and the redetection mask radius.
      i_min_feature_distance_px: 12.0
      i_detector_block_size: 7
      # Harris rather than Shi-Tomasi, matching what the hardware block did.
      i_use_harris: true
      # Subpixel refinement. Cheap at these counts, and corner localisation
      # error feeds straight into pose error.
      i_refine_subpixel: true
      i_lk_window_size: 21
      i_lk_pyramid_levels: 3
      # No real feature moves this far between frames at 30 FPS.
      i_max_displacement_px: 80.0
      # Track forward then back and require the round trip to return home. A
      # mistracked corner can have a small forward residual, so this catches
      # failures the error threshold alone accepts. Costs a second LK pass.
      i_forward_backward_check: true
      i_forward_backward_threshold_px: 1.0
      # Top up with fresh corners once surviving tracks fall below this.
      i_redetect_below: 200
      # LK is unreliable at the frame edges, and the rectified periphery of this
      # wide lens is stretched.
      i_border_margin_px: 12

      # ---- Spatial spread -------------------------------------------------
      i_bucket_cols: 8
      i_bucket_rows: 5
      i_max_features_per_bucket: 10

      # ---- RANSAC ---------------------------------------------------------
      i_ransac_min_iterations: 20
      i_ransac_max_iterations: 200
      i_ransac_inlier_threshold_px: 2.0
      i_ransac_confidence: 0.999
      i_min_inliers: 12
      i_min_inlier_ratio: 0.35

      # ---- Refinement -----------------------------------------------------
      i_gn_max_iterations: 10
      i_huber_delta_px: 1.5

      # ---- Keyframe policy ------------------------------------------------
      # Set to false for the frame-to-frame A/B drift comparison described in
      # the README verification section.
      i_keyframe_referenced: true
      i_keyframe_min_tracked: 60

      # The most consequential parameter here, and a real optimum rather than
      # "bigger is better". Too small and parallax vanishes, making translation
      # unobservable; too large and the keyframe's own triangulation bias
      # accumulates over the span. Simulation found frame-to-frame beating a
      # 30-frame span by 2.2-3.6x at brisk motion, and losing by 1.5x when
      # nearly stationary. A parallax target adapts between those regimes
      # automatically. 15 px sits just above the observability floor; the
      # original 60 px produced spans deep into the losing regime.
      i_keyframe_max_parallax_px: 15.0

      i_keyframe_max_age_frames: 30

      # ---- Motion plausibility -------------------------------------------
      # Per keyframe span, not per frame, so these are deliberately generous.
      i_max_translation_per_span_m: 5.0
      i_max_rotation_per_span_rad: 1.5

      # ---- Noise model ----------------------------------------------------
      i_pixel_sigma_px: 0.3
      # MEASURED: 0.3 px, from the temporal standard deviation of disparity per
      # pixel with the camera held still. That assumes nothing about the scene or
      # the camera model, which is what makes it the trustworthy figure.
      #
      # Readings, best coverage first -- coverage is what decides how much to
      # believe each one:
      #     91.5% valid -> 0.301 px   (0.51 m)
      #     74.2% valid -> 0.266 px   (0.72 m)
      #      4-13% valid -> 0.425-0.507 px
      #       0.1% valid -> ~1.0 px   (0.36 m, past the matcher's search limit)
      #
      # Note the low-coverage runs read WORSE, not better. The caution in the tool
      # about them being optimistically biased toward easy pixels turned out to be
      # backwards: on poor texture the few surviving matches are marginal ones, so
      # they read noisier. Trust the high-coverage numbers.
      #
      # For contrast the subpixel quantisation step is 0.031 px, so using that here
      # would understate the noise tenfold.
      i_disparity_sigma_px: 0.3
      # The formal covariance came out ~2.7x over-confident in simulation.
      # Re-derive from real logs once Phase 3 data exists.
      i_covariance_inflation: 3.0

      i_use_constant_velocity_seed: true
      i_publish_debug_features: false

      # ---- IMU aid: the gyro rotation prior (Phase 4, steps 1-3) ---------
      # Integrates the gyro between frame timestamps and uses the result as the
      # rotation part of the RANSAC seed. Translation still comes from constant
      # velocity.
      #
      # Cheap and low-risk: the seed is evaluated as one RANSAC hypothesis among
      # many, so a good prior helps and a bad one is outvoted. It earns its keep
      # under fast rotation, which is exactly when the constant-velocity model is
      # worst AND motion blur has thinned the corners -- the seed matters most
      # when the vision is weakest. At the 10 Hz this rig is FSYNC-limited to,
      # 2 rad/s is 0.2 rad between frames, well past what extrapolating the last
      # frame can predict.
      #
      # Needs an IMU-to-camera extrinsic in the device calibration. If there
      # isn't one, startup says so and the VO runs on vision alone.
      i_imu_enabled: true
      i_imu_report_rate_hz: 200.0
      # Low threshold keeps latency down: the prior is only useful if this
      # frame's samples have arrived by the time the frame callback runs.
      i_imu_batch_report_threshold: 1
      i_imu_max_batch_reports: 10
      # RAW rather than CALIBRATED, so the firmware's bias correction and the
      # one below are not both correcting the same thing.
      i_imu_use_raw_sensors: true

      # Reject the prior when less than this fraction of the frame interval is
      # covered by closely-spaced samples (see i_imu_max_sample_gap_factor). A
      # window that has lost a burst attributes zero rotation to the gap, and a
      # confidently-too-small prior is worse than none.
      i_imu_min_sample_coverage: 0.6
      # Longest sample spacing still counted as covered, in multiples of
      # 1/report_rate. Raise if the IMU stream is bursty and good priors are
      # being rejected; the health line reports the rejection reason.
      i_imu_max_sample_gap_factor: 3.0

      # How much of the gyro rotation to put in the seed: 1.0 gyro only, 0.0
      # ignore it, in between a geodesic blend with the constant-velocity
      # prediction. Lower it only if the extrinsic is suspect -- a wrong
      # extrinsic makes the prior confidently wrong in a fixed direction.
      i_imu_rotation_prior_weight: 1.0

      # Gyro bias, estimated from intervals where the platform is judged still.
      # Both tests must pass: a smooth constant-rate turn holds |a| at gravity
      # while plainly rotating, and would otherwise teach the filter to subtract
      # the turn rate from every frame.
      i_imu_estimate_gyro_bias: true
      i_imu_static_gyro_threshold: 0.02     # rad/s
      i_imu_static_accel_tolerance: 0.35    # m/s^2 around 9.81
      i_imu_bias_min_samples: 200           # one second at 200 Hz
      # 1.5 rad between frames is 86 deg. Seeing it means the timestamps or the
      # samples are wrong, not that the camera moved.
      i_imu_max_rotation_per_interval_rad: 1.5

      # ---- IMU aid: the error-state filter (Phase 4, steps 4-5) ----------
      # SCAFFOLD. Off, and it should stay off until there are loop-drift numbers
      # to compare. Propagation and the gravity update are unit tested; the
      # filter as a whole has never run on hardware, and its VO update treats
      # correlated absolute poses as independent fixes, which makes it
      # over-confident -- the dangerous direction for anything downstream.
      #
      # What it would buy, honestly: bounded roll and pitch (gravity is an
      # absolute direction, so those two axes are observable and correctable),
      # smoother output between frames, and odometry at IMU rate. NOT bounded
      # yaw or position -- nothing here can fix those without an external
      # reference.
      i_imu_filter_enabled: false
      i_imu_filter_use_gravity: true
      # Much larger than the sensor's own noise on purpose: the measurement
      # model assumes no linear acceleration, and on a walking robot that is
      # usually false, so the residual is dominated by unmodelled motion rather
      # than by sensor noise.
      i_imu_filter_gravity_sigma: 1.5
      i_imu_filter_gravity_gate: 1.0
      i_imu_filter_vo_covariance_scale: 1.0
      # Republish odometry at IMU rate from the filter instead of at frame rate
      # from the VO. Needs i_imu_filter_enabled. The frame-rate publish stands
      # down when this is on, so the topic carries one pose per instant.
      i_publish_at_imu_rate: false

      # ---- LENS neural depth (Phase 5) -----------------------------------
      # Co-run NeuralDepth on the DSP alongside the VO. The engines are separate
      # -- VO uses the stereo block and (optionally) the feature-tracker block --
      # so they should coexist. "Should" is why there is a measurement:
      #
      #     python3 tools/phase5_resource_check.py --device <ip>
      #
      # Fed the already-rectified pair with its own rectification disabled, so
      # it does not redo StereoDepth's work and its depth lands in the frame the
      # estimator already uses.
      i_enable_neural_depth: false
      # NEURAL_DEPTH_NANO / SMALL / MEDIUM / LARGE / EXTRA_LARGE. SMALL is the
      # sensible starting point on a device also running VO: the larger models
      # buy resolution the VO cannot use at a DSP cost that is the whole thing
      # being measured.
      i_neural_depth_model: NEURAL_DEPTH_SMALL

      # Where the VO gets feature depth: "block_matcher" or "neural".
      #
      # A separate question from the co-run above, and it has a different
      # answer. Neural depth is smoothed and, on low texture, partly inferred --
      # good for dense perception, and a locally biased depth at a feature is a
      # biased pose. Prefer the block matcher for VO when both are running; use
      # "neural" if the DSP path is the only one available, or to A/B it.
      i_depth_source: block_matcher
